<style data-page-node-id="Io3cJqW9JKdATTuQKQ7wbp" data-pnid-children="aIFNn5OLwLuJXUDsVnw6TE">
:root{
  --bg:#F7F1EE; --card:#FFFFFF; --sidebar:#F1E4E7; --sidebar-deep:#E9D7DC;
  --primary:#C78B98; --primary-deep:#A96F7E; --primary-soft:#EBD4DA; --primary-ghost:#F6EAED;
  --text:#55454A; --text-sub:#948083; --text-faint:#B8A7AC;
  --border:#EAD8DD; --border-soft:#F3E7EB;
  --danger:#C97B7B; --danger-soft:#F3DCDC; --danger-line:#E0A6A6;
  --warning:#C79A63; --warning-soft:#F4E7D3; --warning-line:#DDB98A;
  --success:#8FA98B; --success-soft:#E2EBDF;
  --blue:#8BA3B5; --blue-soft:#E0E8EE;
  --shadow:0 2px 10px rgba(169,111,126,.06);
  --radius:16px; --radius-sm:11px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
a{color:var(--primary-deep); text-decoration:none;}
input,select,textarea{
  font-family:inherit; font-size:16px; color:var(--text);
  background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; outline:none; transition:border .2s, box-shadow .2s; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
::placeholder{color:var(--text-faint);}

/* ===== 布局 ===== */
.app{display:flex; min-height:100vh;}

/* 侧边栏 */
.sidebar{
  width:224px; flex-shrink:0; background:var(--sidebar);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  border-right:1px solid var(--border); transition:width .25s ease; overflow:hidden; z-index:20;
}
.sidebar.collapsed{width:72px;}
.sidebar-header{display:flex; align-items:center; gap:10px; padding:18px 16px 12px;}
.sidebar .logo-badge{
  width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,#D9A3AE,#C78B98);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 8px rgba(199,139,152,.3);
}
.sidebar .site-title{font-size:17px; font-weight:700; color:var(--primary-deep); white-space:nowrap; letter-spacing:.5px;}
.collapse-wrap{padding:0 16px 8px;}
.collapse-btn{
  width:100%; min-height:40px; border-radius:var(--radius-sm); background:#fff; border:1px solid var(--border);
  color:var(--text-sub); display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px;
  transition:.2s;
}
.collapse-btn:hover{background:var(--primary-ghost); color:var(--primary-deep);}
.collapse-btn svg{flex-shrink:0;}
.collapse-btn .c-text{white-space:nowrap;}

.nav{flex:1; padding:6px 12px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius-sm);
  color:var(--text-sub); font-size:14.5px; min-height:44px; transition:.18s; white-space:nowrap; position:relative;
}
.nav-item:hover{background:#fff; color:var(--primary-deep);}
.nav-item.active{background:#fff; color:var(--primary-deep); font-weight:600; box-shadow:var(--shadow);}
.nav-item.active::before{
  content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:4px; height:22px; border-radius:4px; background:var(--primary);
}
.nav-item .nav-ico{width:24px; height:24px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.nav-item .nav-text{white-space:nowrap;}

.sidebar-footer{padding:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
.footer-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-faint); min-height:32px; white-space:nowrap;}
.sync-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--success);}
.sync-dot.syncing{background:var(--warning); animation:blink 1s infinite;}
.sync-dot.offline{background:var(--danger);}
@keyframes blink{50%{opacity:.35;}}
.mini-actions{display:flex; gap:6px;}
.mini-btn{
  flex:1; min-height:40px; border-radius:10px; background:#fff; border:1px solid var(--border);
  color:var(--text-sub); font-size:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:.18s;
}
.mini-btn:hover{background:var(--primary-ghost); color:var(--primary-deep); border-color:var(--primary-soft);}

/* 主内容 */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:60px; flex-shrink:0; background:rgba(247,241,238,.85); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  border-bottom:1px solid var(--border-soft); position:sticky; top:0; z-index:10;
}
.topbar .t-title{font-size:18px; font-weight:700; color:var(--text);}
.topbar .t-title small{font-weight:400; color:var(--text-faint); font-size:13px; margin-left:8px;}
.topbar-right{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-sub);}
.content{padding:22px 24px 40px; max-width:1080px; width:100%; margin:0 auto;}

.view{display:none;}
.view.active{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

/* ===== 通用组件 ===== */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h2{font-size:22px; font-weight:700; color:var(--text);}
.page-head .sub{color:var(--text-sub); font-size:13px; margin-top:2px;}
.count-pill{font-size:13px; color:var(--primary-deep); background:var(--primary-ghost); padding:4px 12px; border-radius:20px; font-weight:600;}

.card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border-soft); box-shadow:var(--shadow); padding:18px; margin-bottom:18px;}
.card h3{font-size:15px; font-weight:700; color:var(--primary-deep); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.card h3 .h-ico{width:18px; height:18px;}

/* 今日待办 */
.today-section{display:flex; flex-direction:column; gap:16px;}
.today-group-title{font-size:13px; font-weight:700; color:var(--text-sub); display:flex; align-items:center; gap:7px; margin:4px 0 10px;}
.today-group-title .g-dot{width:8px; height:8px; border-radius:50%;}
.today-item{
  display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border);
  border-left-width:4px; border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; flex-wrap:wrap;
}
.today-item.overdue{border-left-color:var(--danger); background:var(--danger-soft);}
.today-item.due{border-left-color:var(--warning); background:var(--warning-soft);}
.today-item .t-body{flex:1; min-width:180px;}
.today-item .t-name{font-weight:600; font-size:14.5px;}
.today-item .t-meta{font-size:12.5px; color:var(--text-sub); margin-top:2px;}
.today-item .t-meta .tag{display:inline-block; padding:1px 8px; border-radius:20px; font-size:11.5px; margin-right:6px;}
.tag-red{background:#fff; color:var(--danger);}
.tag-yellow{background:#fff; color:var(--warning);}
.tag-gray{background:var(--primary-ghost); color:var(--primary-deep);}
.tag-blue{background:var(--blue-soft); color:var(--blue);}
.tag-green{background:var(--success-soft); color:var(--success);}
.btn{
  min-height:44px; padding:8px 16px; border-radius:var(--radius-sm); font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:.18s; white-space:nowrap;
}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 3px 8px rgba(199,139,152,.28);}
.btn-primary:hover{background:var(--primary-deep);}
.btn-ghost{background:#fff; border:1px solid var(--border); color:var(--text-sub);}
.btn-ghost:hover{border-color:var(--primary); color:var(--primary-deep);}
.btn-soft{background:var(--primary-ghost); color:var(--primary-deep);}
.btn-soft:hover{background:var(--primary-soft);}
.btn-sm{min-height:36px; padding:5px 12px; font-size:13px;}
.btn-danger{background:#fff; border:1px solid var(--danger-line); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}

/* 表单 */
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.form-grid .full{grid-column:1/-1;}
.field label{display:block; font-size:13px; color:var(--text-sub); margin-bottom:6px; font-weight:600;}
.form-actions{display:flex; gap:10px; margin-top:16px;}

/* 列表 */
.list{}
.list-empty{text-align:center; color:var(--text-faint); padding:28px 0; font-size:14px;}
.group-label{font-size:12.5px; font-weight:700; color:var(--text-sub); margin:16px 0 8px; padding-left:4px;}
.list-item{
  display:flex; align-items:flex-start; gap:14px; background:#fff; border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:14px; margin-bottom:10px; transition:.18s;
}
.list-item:hover{border-color:var(--primary-soft); box-shadow:var(--shadow);}
.item-main{flex:1; min-width:0;}
.item-title{font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; line-height:1.5;}
.b-tier-冲{background:#F0D9DE; color:#B4586B;}
.b-tier-稳{background:var(--blue-soft); color:var(--blue);}
.b-tier-保{background:var(--success-soft); color:var(--success);}
.b-dir{background:var(--primary-ghost); color:var(--primary-deep);}
.b-status{background:var(--primary-ghost); color:var(--primary-deep);}
.b-status-done{background:var(--success-soft); color:var(--success);}
.b-status-doing{background:var(--warning-soft); color:var(--warning);}
.b-pri-高{background:#F0D9DE; color:#B4586B;}
.b-pri-中{background:var(--warning-soft); color:var(--warning);}
.b-pri-低{background:var(--blue-soft); color:var(--blue);}
.item-meta{font-size:12.5px; color:var(--text-sub); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.item-note{font-size:12.5px; color:var(--text-faint); margin-top:4px; font-style:italic;}
.item-actions{display:flex; gap:6px; flex-shrink:0; align-items:center; flex-wrap:wrap;}
.day-pill{font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;}
.day-overdue{background:var(--danger-soft); color:var(--danger);}
.day-soon{background:var(--warning-soft); color:var(--warning);}
.day-normal{background:var(--primary-ghost); color:var(--primary-deep);}
.day-done{background:var(--success-soft); color:var(--success);}

/* 弹窗 */
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:#fff; padding:11px 20px; border-radius:20px; font-size:14px;
  opacity:0; pointer-events:none; transition:.28s; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.18);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}

/* 底部 Tab（移动端） */
.mobile-tab{
  display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px); border-top:1px solid var(--border); z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.mobile-tab .tab-inner{display:flex;}
.mobile-tab .tab-item{
  flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--text-faint); font-size:11px;
}
.mobile-tab .tab-item.active{color:var(--primary-deep); font-weight:600;}
.mobile-tab .tab-item .nav-ico{width:24px; height:24px;}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .sidebar{display:none;}
  .mobile-tab{display:block;}
  .topbar{height:54px; padding:0 16px;}
  .topbar .t-title{font-size:16px;}
  .topbar .t-title small{display:none;}
  .content{padding:16px 14px 100px; max-width:none;}
  .form-grid{grid-template-columns:1fr;}
  .list-item{flex-direction:column;}
  .item-actions{width:100%; justify-content:flex-end;}
  .page-head h2{font-size:19px;}
  .card{padding:15px;}
}
</style>
</head>

      <span data-page-node-id="AJVS646nOqgcQLqM78N7aO" class="nav-ico"><svg data-page-node-id="UleGFt2z0WtyvKTrqAc8zQ" fill="none" height="24" viewBox="0 0 24 24" width="24"><path data-page-node-id="uinf3HUu6IEJdYy87gQ2lS" d="M7 3.5 H14 L17.5 7 V19.5 A1 1 0 0 1 16.5 20.5 H7 A1 1 0 0 1 6 19.5 V4.5 A1 1 0 0 1 7 3.5 Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"/><path data-page-node-id="Z9nEBWKqPmFkMoDVBB8REc" d="M14 3.5 V7 H17.5" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"/></svg></span>
      <span data-page-node-id="vtVUJMIdW60rfrbGKNEf2s"><!--pnid:nXbQstK87ColM05PJUDcTh-->材料清单</span>

<input data-page-node-id="mI4XIfY14QiDvYm52DM35T" accept="application/json" id="importFile" type="file" style="display:none">

<script data-page-node-id="mefA8D8ykQVNhRXyMmBCFC" data-pnid-children="xZFgZjTtSC2f7fcPY9dlu4">
(function(){
  'use strict';
  var db = (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) || null;

  // ===== 常量 =====
  var DB_SCHOOL   = 'F72CTkFxd1jrepaIiIX6UL';
  var DB_NODE     = 'dsHZFDFsr6veCueEqrPSuI';
  var DB_MATERIAL = 'OybQF00KiIk4Q9VHZpyhns';

  var EXAMPLE_IDS = {
    school:   ['4Te7CqGM6WUDC39gQE76Nb','6wnN91hlfbn4lKMSeJHYr0','HvKHCzMsNenQitug0Bb0kb','xWuQiG7G392P3IQhYNTjOG'],
    node:     ['4Y8MEia68mYxiOOXYeRJ2f','pqgWtrn9BEUh4dzvXT5NJf','ncqfUQqLisAUoWm3z93xMX','3dqDN3NgtwSvKJmM08H5qG'],
    material: ['ZMuk8njAicxmEXdl8X2tvu','z0ECjybwZCnchHx29j4h5D','kYR83gC96eUqRdp8WSkcw8','r9CK2P7U0vJrQrdNFJPL5N']
  };

  var TIER_ORDER = ['冲','稳','保'];
  var MAT_ORDER = ['通用','文书','证明','其他'];

  var SCHEMA_OPTIONS = {};  // 字段名 -> [{text,id}]
  var state = { schools:[], nodes:[], materials:[] };
  var todayStr = localDateStr(new Date());

  // ===== 工具 =====
  function $(sel){ return document.querySelector(sel); }
  function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function localDateStr(d){
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function dateOnly(iso){
    if (!iso) return '';
    return String(iso).slice(0,10);
  }
  function fmtDateCn(iso){
    var d = dateOnly(iso);
    if (!d) return '';
    var p = d.split('-');
    return (parseInt(p[1],10)) + '月' + (parseInt(p[2],10)) + '日';
  }
  function daysUntil(iso){
    var d = dateOnly(iso);
    if (!d) return null;
    var a = new Date(d + 'T00:00:00');
    var b = new Date(todayStr + 'T00:00:00');
    var diff = a - b;
    return Math.round(diff / 86400000);
  }
  function optId(field, text){
    var arr = SCHEMA_OPTIONS[field];
    if (arr) {
      for (var i=0;i<arr.length;i++){ if (arr[i].text === text) return arr[i].id; }
    }
    return text; // fallback：server 也接受文本
  }
  function setBind(el, dbId){
    el.setAttribute('data-sp-bindable','database');
    el.setAttribute('data-sp-database-id', dbId);
  }
  function toast(msg, isErr){
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.className = 'toast'; }, 2400);
  }
  function setSync(mode){
    // mode: 'ok' | 'syncing' | 'offline'
    var dot = $('#syncDot'), dot2 = $('#syncDotTop'), txt = $('#syncText'), txt2 = $('#syncTextTop');
    var label = mode==='ok' ? '已同步' : (mode==='syncing' ? '同步中' : '离线模式');
    [dot,dot2].forEach(function(d){ if(d){ d.className = 'sync-dot ' + (mode==='ok'?'':(mode==='syncing'?'syncing':'offline')); } });
    [txt,txt2].forEach(function(t){ if(t) t.textContent = label; });
  }

  // ===== 数据层 =====
  function loadSchools(cursor, acc, guard){
    acc = acc || []; guard = guard || 0;
    if (guard > 100) return Promise.resolve(acc);
    return db.query({ databaseId: 'F72CTkFxd1jrepaIiIX6UL', pageSize: 200, startCursor: cursor })
      .then(function(r){
        acc = acc.concat(r.results || []);
        var next = r.nextCursor;
        if (r.hasMore && next && next !== cursor && (r.results || []).length) return loadSchools(next, acc, guard + 1);
        return acc;
      })
      .catch(function(err){ console.error('[database] 院校加载失败:', err); return acc; });
  }
  function loadNodes(cursor, acc, guard){
    acc = acc || []; guard = guard || 0;
    if (guard > 100) return Promise.resolve(acc);
    return db.query({ databaseId: 'dsHZFDFsr6veCueEqrPSuI', pageSize: 200, startCursor: cursor })
      .then(function(r){
        acc = acc.concat(r.results || []);
        var next = r.nextCursor;
        if (r.hasMore && next && next !== cursor && (r.results || []).length) return loadNodes(next, acc, guard + 1);
        return acc;
      })
      .catch(function(err){ console.error('[database] 节点加载失败:', err); return acc; });
  }
  function loadMaterials(cursor, acc, guard){
    acc = acc || []; guard = guard || 0;
    if (guard > 100) return Promise.resolve(acc);
    return db.query({ databaseId: 'OybQF00KiIk4Q9VHZpyhns', pageSize: 200, startCursor: cursor })
      .then(function(r){
        acc = acc.concat(r.results || []);
        var next = r.nextCursor;
        if (r.hasMore && next && next !== cursor && (r.results || []).length) return loadMaterials(next, acc, guard + 1);
        return acc;
      })
      .catch(function(err){ console.error('[database] 材料加载失败:', err); return acc; });
  }
  function getSchemas(){
    return Promise.all([
      db.getSchema({ databaseId: 'F72CTkFxd1jrepaIiIX6UL' }),
      db.getSchema({ databaseId: 'dsHZFDFsr6veCueEqrPSuI' }),
      db.getSchema({ databaseId: 'OybQF00KiIk4Q9VHZpyhns' })
    ]).then(function(schemas){
      schemas.forEach(function(schema){
        (schema.properties || []).forEach(function(field){
          if ((field.type === 'select' || field.type === 'multi_select') && field.config && field.config.options) {
            SCHEMA_OPTIONS[field.name] = field.config.options;
          }
        });
      });
      renderSelectOptions();
    }).catch(function(err){
      console.error('[database] schema 加载失败:', err);
      setSync('offline');
    });
  }
  function refreshAll(){
    setSync('syncing');
    return loadSchools().then(function(rows){
      state.schools = rows;
      return loadNodes();
    }).then(function(rows){
      state.nodes = rows;
      return loadMaterials();
    }).then(function(rows){
      state.materials = rows;
      setSync('ok');
      renderAll();
    }).catch(function(err){
      console.error('[database] 数据加载失败:', err);
      setSync('offline');
      renderAll(); // 用已有数据渲染，页面不空白
    });
  }

  // ===== 渲染层（单向：只读 state，互不调用）=====
  function renderAll(){
    renderToday();
    renderSchools();
    renderNodes();
    renderMaterials();
  }

  function renderToday(){
    var box = $('#todayList');
    var html = '';
    var overdueNodes = [], dueNodes = [], todoMats = [];

    state.nodes.forEach(function(n){
      if (n['进度'] === '已完成') return;
      var d = daysUntil(n['日期']);
      if (d === null) return;
      if (d < 0) overdueNodes.push({n:n, d:d});
      else if (d <= 7) dueNodes.push({n:n, d:d});
    });
    state.materials.forEach(function(m){
      if (m['状态'] === '待准备' || m['状态'] === '进行中') todoMats.push(m);
    });

    var total = overdueNodes.length + dueNodes.length + todoMats.length;
    var countEl = $('#todayCount');
    if (countEl) countEl.textContent = total + ' 项';

    if (total === 0){
      box.innerHTML = '<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-faint);">今天没有待处理事项，安心复习吧 🌸</div>';
      return;
    }

    if (overdueNodes.length){
      html += '<div class="today-group-title"><span class="g-dot" style="background:var(--danger)"></span>已逾期 · 尽快处理</div>';
      overdueNodes.forEach(function(o){
        html += '<div class="today-item overdue">'
          + '<div class="t-body"><div class="t-name">' + esc(o.n['事件']) + '</div>'
          + '<div class="t-meta"><span class="tag tag-red">已逾期 ' + Math.abs(o.d) + ' 天</span>' + esc(fmtDateCn(o.n['日期'])) + '</div></div>'
          + '<button class="btn btn-primary btn-sm" data-marknode="' + esc(o.n._id) + '">标记完成</button>'
          + '</div>';
      });
    }
    if (dueNodes.length){
      html += '<div class="today-group-title"><span class="g-dot" style="background:var(--warning)"></span>今天 · 7 天内截止</div>';
      dueNodes.forEach(function(o){
        var tag = o.d === 0 ? '<span class="tag tag-yellow">今天到期</span>' : '<span class="tag tag-yellow">剩 ' + o.d + ' 天</span>';
        html += '<div class="today-item due">'
          + '<div class="t-body"><div class="t-name">' + esc(o.n['事件']) + '</div>'
          + '<div class="t-meta">' + tag + esc(fmtDateCn(o.n['日期'])) + '</div></div>'
          + '<button class="btn btn-primary btn-sm" data-marknode="' + esc(o.n._id) + '">标记完成</button>'
          + '</div>';
      });
    }
    if (todoMats.length){
      html += '<div class="today-group-title"><span class="g-dot" style="background:var(--primary)"></span>待办材料</div>';
      todoMats.forEach(function(m){
        var cls = m['状态'] === '进行中' ? 'tag-yellow' : 'tag-gray';
        html += '<div class="today-item">'
          + '<div class="t-body"><div class="t-name">' + esc(m['材料']) + '</div>'
          + '<div class="t-meta"><span class="tag ' + cls + '">' + esc(m['状态']) + '</span>' + esc(m['类型']) + '</div></div>'
          + '<button class="btn btn-soft btn-sm" data-advmat="' + esc(m._id) + '">推进状态</button>'
          + '</div>';
      });
    }
    box.innerHTML = html;
  }

  function renderSchools(){
    var box = $('#schoolList');
    var countEl = $('#schoolCount');
    if (countEl) countEl.textContent = state.schools.length + ' 所';
    if (state.schools.length === 0){
      box.innerHTML = '<div class="list-empty">还没有院校，点击上方添加第一所目标院校吧</div>';
      return;
    }
    var html = '';
    TIER_ORDER.forEach(function(tier){
      var rows = state.schools.filter(function(s){ return s['梯队'] === tier; });
      if (!rows.length) return;
      html += '<div class="group-label">' + tier + ' · ' + rows.length + ' 所</div>';
      rows.forEach(function(s){
        html += '<div class="list-item">'
          + '<div class="item-main">'
          + '<div class="item-title"><span>' + esc(s['学校']) + '</span>'
          + '<span class="badge b-tier-' + esc(s['梯队']) + '">' + esc(s['梯队']) + '</span>'
          + (s['方向'] ? '<span class="badge b-dir">' + esc(s['方向']) + '</span>' : '')
          + '<span class="badge b-status">' + esc(s['报名状态'] || '未开始') + '</span></div>'
          + '<div class="item-meta">' + (s['城市'] ? '<span>📍 ' + esc(s['城市']) + '</span>' : '') + '</div>'
          + (s['备注'] ? '<div class="item-note">' + esc(s['备注']) + '</div>' : '')
          + '</div>'
          + '<div class="item-actions">'
          + (s['官网'] && s['官网'].link ? '<a class="btn btn-ghost btn-sm" href="' + esc(s['官网'].link) + '" target="_blank" rel="noopener">官网</a>' : '')
          + '<button class="btn btn-soft btn-sm" data-schooladv="' + esc(s._id) + '">推进状态</button>'
          + '<button class="btn btn-danger btn-sm" data-del="' + esc(s._id) + '" data-tbl="school">删除</button>'
          + '</div></div>';
      });
    });
    box.innerHTML = html;
  }

  function renderNodes(){
    var box = $('#nodeList');
    var countEl = $('#nodeCount');
    if (countEl) countEl.textContent = state.nodes.length + ' 个';
    if (state.nodes.length === 0){
      box.innerHTML = '<div class="list-empty">还没有节点，先把六级考试加进来吧</div>';
      return;
    }
    var rows = state.nodes.slice().sort(function(a,b){
      var da = dateOnly(a['日期']) || '9999';
      var db2 = dateOnly(b['日期']) || '9999';
      return da < db2 ? -1 : (da > db2 ? 1 : 0);
    });
    var html = '';
    rows.forEach(function(n){
      var done = n['进度'] === '已完成';
      var d = daysUntil(n['日期']);
      var pill = '';
      if (done) pill = '<span class="day-pill day-done">已完成</span>';
      else if (d === null) pill = '';
      else if (d < 0) pill = '<span class="day-pill day-overdue">逾期 ' + Math.abs(d) + ' 天</span>';
      else if (d === 0) pill = '<span class="day-pill day-soon">今天</span>';
      else if (d <= 7) pill = '<span class="day-pill day-soon">剩 ' + d + ' 天</span>';
      else pill = '<span class="day-pill day-normal">剩 ' + d + ' 天</span>';

      html += '<div class="list-item">'
        + '<div class="item-main">'
        + '<div class="item-title"><span>' + esc(n['事件']) + '</span>'
        + (n['优先级'] ? '<span class="badge b-pri-' + esc(n['优先级']) + '">' + esc(n['优先级']) + '</span>' : '')
        + (done ? '<span class="badge b-status-done">已完成</span>' : '<span class="badge b-status">待办</span>')
        + '</div>'
        + '<div class="item-meta">' + pill + '<span>' + esc(fmtDateCn(n['日期'])) + '</span></div>'
        + (n['备注'] ? '<div class="item-note">' + esc(n['备注']) + '</div>' : '')
        + '</div>'
        + '<div class="item-actions">'
        + (done ? '<button class="btn btn-ghost btn-sm" data-unmarknode="' + esc(n._id) + '">撤销</button>'
               : '<button class="btn btn-primary btn-sm" data-marknode="' + esc(n._id) + '">完成</button>')
        + '<button class="btn btn-danger btn-sm" data-del="' + esc(n._id) + '" data-tbl="node">删除</button>'
        + '</div></div>';
    });
    box.innerHTML = html;
  }

  function renderMaterials(){
    var box = $('#materialList');
    var countEl = $('#materialCount');
    if (countEl) countEl.textContent = state.materials.length + ' 项';
    if (state.materials.length === 0){
      box.innerHTML = '<div class="list-empty">还没有材料，先加一份个人简历吧</div>';
      return;
    }
    var html = '';
    MAT_ORDER.forEach(function(type){
      var rows = state.materials.filter(function(m){ return m['类型'] === type; });
      if (!rows.length) return;
      html += '<div class="group-label">' + type + ' · ' + rows.length + ' 项</div>';
      rows.forEach(function(m){
        var st = m['状态'] || '待准备';
        var stCls = st === '已完成' ? 'b-status-done' : (st === '进行中' ? 'b-status-doing' : 'b-status');
        html += '<div class="list-item">'
          + '<div class="item-main">'
          + '<div class="item-title"><span>' + esc(m['材料']) + '</span>'
          + '<span class="badge b-dir">' + esc(m['类型']) + '</span>'
          + '<span class="badge ' + stCls + '">' + esc(st) + '</span></div>'
          + (m['备注'] ? '<div class="item-note">' + esc(m['备注']) + '</div>' : '')
          + '</div>'
          + '<div class="item-actions">'
          + (st !== '已完成' ? '<button class="btn btn-primary btn-sm" data-advmat="' + esc(m._id) + '">' + (st === '待准备' ? '开始准备' : '标记完成') + '</button>' : '')
          + '<button class="btn btn-danger btn-sm" data-del="' + esc(m._id) + '" data-tbl="material">删除</button>'
          + '</div></div>';
      });
    });
    box.innerHTML = html;
  }

  // ===== 表单 select 填充 =====
  function renderSelectOptions(){
    $all('select').forEach(function(sel){
      var field = sel.getAttribute('name');
      var opts = SCHEMA_OPTIONS[field];
      if (!opts) return;
      var keep = sel.value;
      sel.innerHTML = '<option value="">请选择</option>';
      opts.forEach(function(o){
        var opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.text;
        sel.appendChild(opt);
      });
      if (keep) sel.value = keep;
    });
  }

  // ===== 表单缓存（localStorage）=====
  function cacheKey(name){ return 'wb_baoyan_form_' + name; }
  function saveForm(name, form){
    try{
      var data = {};
      $all('input,select,textarea', form).forEach(function(el){
        if (el.name && el.type !== 'submit' && el.type !== 'button') data[el.name] = el.value;
      });
      localStorage.setItem(cacheKey(name), JSON.stringify(data));
    }catch(e){}
  }
  function restoreForm(name, form){
    try{
      var raw = localStorage.getItem(cacheKey(name));
      if (!raw) return;
      var data = JSON.parse(raw);
      $all('input,select,textarea', form).forEach(function(el){
        if (el.name && data[el.name] !== undefined) el.value = data[el.name];
      });
    }catch(e){}
  }
  function clearFormCache(name){
    try{ localStorage.removeItem(cacheKey(name)); }catch(e){}
  }
  function bindFormCache(name, form){
    var debounce = null;
    form.addEventListener('input', function(){
      clearTimeout(debounce);
      debounce = setTimeout(function(){ saveForm(name, form); }, 300);
    });
    form.addEventListener('change', function(){ saveForm(name, form); });
  }

  // ===== 事件处理 =====
  function bindEvents(){
    // 导航切换（侧边栏 + 移动 Tab）
    $all('.nav-item, .tab-item').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        switchView(a.getAttribute('data-view'));
      });
    });

    // 侧边栏收起
    $('#collapseBtn').addEventListener('click', function(){
      var sb = $('#sidebar');
      sb.classList.toggle('collapsed');
      var ctext = $('.c-text');
      ctext.textContent = sb.classList.contains('collapsed') ? '' : '收起导航';
    });

    // 表单提交
    $('#schoolForm').addEventListener('submit', onSchoolSubmit);
    $('#nodeForm').addEventListener('submit', onNodeSubmit);
    $('#materialForm').addEventListener('submit', onMaterialSubmit);
    bindFormCache('school', $('#schoolForm'));
    bindFormCache('node', $('#nodeForm'));
    bindFormCache('material', $('#materialForm'));

    // 备份 / 恢复 / 清空示例
    $('#exportBtn').addEventListener('click', exportJson);
    $('#importBtn').addEventListener('click', function(){ $('#importFile').click(); });
    $('#importFile').addEventListener('change', importJson);
    $('#clearExampleBtn').addEventListener('click', clearExamples);

    // 列表操作（事件委托）
    document.addEventListener('click', function(e){
      var t = e.target.closest ? e.target.closest('[data-marknode],[data-unmarknode],[data-advmat],[data-schooladv],[data-del]') : null;
      if (!t) return;
      if (t.hasAttribute('data-marknode')) { markNode(t.getAttribute('data-marknode'), true); }
      else if (t.hasAttribute('data-unmarknode')) { markNode(t.getAttribute('data-unmarknode'), false); }
      else if (t.hasAttribute('data-advmat')) { advanceMaterial(t.getAttribute('data-advmat')); }
      else if (t.hasAttribute('data-schooladv')) { advanceSchool(t.getAttribute('data-schooladv')); }
      else if (t.hasAttribute('data-del')) { deleteRecord(t.getAttribute('data-tbl'), t.getAttribute('data-del')); }
    });

    // 数据订阅
    if (db && typeof db.onUpdated === 'function'){
      var deb = null;
      db.onUpdated(function(payload){
        var ids = (payload && payload.databaseIds) || [];
        if (ids.indexOf(DB_SCHOOL) === -1 && ids.indexOf(DB_NODE) === -1 && ids.indexOf(DB_MATERIAL) === -1) return;
        clearTimeout(deb);
        deb = setTimeout(refreshAll, 300);
      });
    }
  }

  function switchView(view){
    $all('.view').forEach(function(v){ v.classList.remove('active'); });
    var target = $('#view-' + view);
    if (target) target.classList.add('active');
    $all('.nav-item').forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-view') === view); });
    $all('.tab-item').forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-view') === view); });
  }

  function onSchoolSubmit(e){
    e.preventDefault();
    var form = e.target;
    var v = function(n){ var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!v('学校')) { toast('请填写学校名称', true); return; }
    var properties = {};
    if (v('学校')) properties['学校'] = { text: v('学校') };
    if (v('城市')) properties['城市'] = { text: v('城市') };
    if (v('梯队')) properties['梯队'] = { select: v('梯队') };
    if (v('方向')) properties['方向'] = { select: v('方向') };
    if (v('报名状态')) properties['报名状态'] = { select: v('报名状态') };
    if (v('官网')) properties['官网'] = { url: { text: '官网', link: v('官网') } };
    if (v('备注')) properties['备注'] = { text: v('备注') };
    submitForm(form, 'school', properties, 'school');
  }

  function onNodeSubmit(e){
    e.preventDefault();
    var form = e.target;
    var v = function(n){ var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!v('事件') || !v('日期')) { toast('请填写事件和日期', true); return; }
    var properties = {
      '事件': { text: v('事件') },
      '日期': { date: v('日期') },
      '进度': { select: optId('进度','待办') }
    };
    if (v('优先级')) properties['优先级'] = { select: v('优先级') };
    if (v('备注')) properties['备注'] = { text: v('备注') };
    submitForm(form, 'node', properties, 'node');
  }

  function onMaterialSubmit(e){
    e.preventDefault();
    var form = e.target;
    var v = function(n){ var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!v('材料')) { toast('请填写材料名称', true); return; }
    var properties = {
      '材料': { text: v('材料') },
      '状态': { select: optId('状态','待准备') }
    };
    if (v('类型')) properties['类型'] = { select: v('类型') };
    if (v('备注')) properties['备注'] = { text: v('备注') };
    submitForm(form, 'material', properties, 'material');
  }

  function submitForm(form, tbl, properties, cacheName){
    var btn = form.querySelector('[type="submit"]');
    if (btn){ btn.disabled = true; btn.textContent = '保存中...'; }
    setSync('syncing');
    var p;
    if (tbl === 'school') p = db.addRecord({ databaseId: 'F72CTkFxd1jrepaIiIX6UL', properties: properties });
    else if (tbl === 'node') p = db.addRecord({ databaseId: 'dsHZFDFsr6veCueEqrPSuI', properties: properties });
    else p = db.addRecord({ databaseId: 'OybQF00KiIk4Q9VHZpyhns', properties: properties });
    p.then(function(){
        form.reset();
        clearFormCache(cacheName);
        toast('已保存');
        return refreshAll();
      })
      .catch(function(err){
        console.error('[database] 保存失败:', err);
        toast('保存失败，请重试', true);
        setSync('offline');
      })
      .finally(function(){
        if (btn){ btn.disabled = false; btn.textContent = '保存'; }
      });
  }

  function markNode(recordId, done){
    setSync('syncing');
    db.updateRecord({
      databaseId: 'dsHZFDFsr6veCueEqrPSuI',
      recordId: recordId,
      properties: { '进度': { select: optId('进度', done ? '已完成' : '待办') } }
    }).then(function(){ toast(done ? '已标记完成' : '已撤销'); return refreshAll(); })
      .catch(function(err){ console.error(err); toast('操作失败', true); setSync('offline'); });
  }

  function advanceMaterial(recordId){
    var m = state.materials.filter(function(x){ return x._id === recordId; })[0];
    if (!m) return;
    var cur = m['状态'] || '待准备';
    var next = cur === '待准备' ? '进行中' : '已完成';
    setSync('syncing');
    db.updateRecord({
      databaseId: 'OybQF00KiIk4Q9VHZpyhns',
      recordId: recordId,
      properties: { '状态': { select: optId('状态', next) } }
    }).then(function(){ toast('已更新为「' + next + '」'); return refreshAll(); })
      .catch(function(err){ console.error(err); toast('操作失败', true); setSync('offline'); });
  }

  function advanceSchool(recordId){
    var s = state.schools.filter(function(x){ return x._id === recordId; })[0];
    if (!s) return;
    var flow = ['未开始','已报名','已入营','已offer','已放弃'];
    var cur = s['报名状态'] || '未开始';
    var idx = flow.indexOf(cur);
    var next = (idx >= 0 && idx < flow.length - 1) ? flow[idx + 1] : flow[0];
    setSync('syncing');
    db.updateRecord({
      databaseId: 'F72CTkFxd1jrepaIiIX6UL',
      recordId: recordId,
      properties: { '报名状态': { select: optId('报名状态', next) } }
    }).then(function(){ toast('已更新为「' + next + '」'); return refreshAll(); })
      .catch(function(err){ console.error(err); toast('操作失败', true); setSync('offline'); });
  }

  function deleteRecord(tbl, recordId){
    if (!confirm('确定删除这条记录吗？删除后不可恢复。')) return;
    setSync('syncing');
    var p;
    if (tbl === 'school') p = db.deleteRecord({ databaseId: 'F72CTkFxd1jrepaIiIX6UL', recordId: recordId });
    else if (tbl === 'node') p = db.deleteRecord({ databaseId: 'dsHZFDFsr6veCueEqrPSuI', recordId: recordId });
    else p = db.deleteRecord({ databaseId: 'OybQF00KiIk4Q9VHZpyhns', recordId: recordId });
    p.then(function(){ toast('已删除'); return refreshAll(); })
      .catch(function(err){ console.error(err); toast('删除失败', true); setSync('offline'); });
  }

  function clearExamples(){
    if (!confirm('确定清空示例数据吗？只会删除预置的示例记录，你后来自己添加的数据会保留。')) return;
    setSync('syncing');
    var p = Promise.resolve();
    EXAMPLE_IDS.school.forEach(function(id){ p = p.then(function(){ return db.deleteRecord({ databaseId: 'F72CTkFxd1jrepaIiIX6UL', recordId: id }); }); });
    EXAMPLE_IDS.node.forEach(function(id){ p = p.then(function(){ return db.deleteRecord({ databaseId: 'dsHZFDFsr6veCueEqrPSuI', recordId: id }); }); });
    EXAMPLE_IDS.material.forEach(function(id){ p = p.then(function(){ return db.deleteRecord({ databaseId: 'OybQF00KiIk4Q9VHZpyhns', recordId: id }); }); });
    p.then(function(){ toast('示例数据已清空'); return refreshAll(); })
      .catch(function(err){ console.error(err); toast('清空失败', true); setSync('offline'); });
  }

  // ===== 备份 / 恢复 =====
  function exportJson(){
    var data = { version: 1, exportedAt: new Date().toISOString(), schools: state.schools, nodes: state.nodes, materials: state.materials };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '保研工作台备份_' + todayStr + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('备份已导出');
  }

  function importJson(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var schools = data.schools || [];
        var nodes = data.nodes || [];
        var materials = data.materials || [];
        if (!schools.length && !nodes.length && !materials.length){ toast('文件里没有数据', true); return; }
        var ops = [];
        schools.forEach(function(r){
          ops.push({ tbl: 'school', props: pickProps(r, ['学校','城市','梯队','方向','报名状态','官网','备注']) });
        });
        nodes.forEach(function(r){
          ops.push({ tbl: 'node', props: pickProps(r, ['事件','日期','优先级','进度','备注']) });
        });
        materials.forEach(function(r){
          ops.push({ tbl: 'material', props: pickProps(r, ['材料','类型','状态','备注']) });
        });
        setSync('syncing');
        var p = Promise.resolve();
        ops.forEach(function(op){
          p = p.then(function(){
            if (op.tbl === 'school') return db.addRecord({ databaseId: 'F72CTkFxd1jrepaIiIX6UL', properties: op.props });
            if (op.tbl === 'node') return db.addRecord({ databaseId: 'dsHZFDFsr6veCueEqrPSuI', properties: op.props });
            return db.addRecord({ databaseId: 'OybQF00KiIk4Q9VHZpyhns', properties: op.props });
          });
        });
        p.then(function(){ toast('已恢复 ' + ops.length + ' 条记录'); return refreshAll(); })
          .catch(function(err){ console.error(err); toast('恢复失败', true); setSync('offline'); });
      }catch(err){
        toast('文件解析失败', true);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function pickProps(row, fields){
    var out = {};
    fields.forEach(function(f){
      if (row[f] !== undefined && row[f] !== null && f !== '_id' && f !== 'record_id'){
        var v = row[f];
        // 根据类型还原 PropertyValue
        if (f === '官网') out[f] = { url: (v && v.link) ? { text: (v.text || '官网'), link: v.link } : { text: '', link: '' } };
        else if (f === '日期') out[f] = { date: dateOnly(v) };
        else if (typeof v === 'number') out[f] = { number: v };
        else if (typeof v === 'boolean') out[f] = { checkbox: v };
        else out[f] = { text: String(v) };
      }
    });
    // 修正 select 字段
    ['梯队','方向','报名状态','优先级','进度','类型','状态'].forEach(function(f){
      if (row[f] && typeof row[f] === 'string') out[f] = { select: row[f] };
    });
    return out;
  }

  // ===== 初始化 =====
  function init(){
    bindEvents();
    if (!db){
      $('#todayList').innerHTML = '<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-sub);">当前环境未接入在线数据能力，请通过资料库链接打开本工作台。</div>';
      setSync('offline');
      return;
    }
    getSchemas().then(function(){
      restoreForm('school', $('#schoolForm'));
      restoreForm('node', $('#nodeForm'));
      restoreForm('material', $('#materialForm'));
      return refreshAll();
    });
  }

  init();
})();
</script>
</body>
